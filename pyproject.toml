[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-gateway"
version = "0.1.2"
description = "Argus: a security layer for OpenAI-compatible LLM traffic — an OpenAI-compatible AI gateway with pluggable threat detectors, policy enforcement, audit, and cost intelligence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karmendra Pandey" }]
keywords = ["llm", "ai-gateway", "proxy", "cost", "routing", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tokenecon>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/karmendra8386/argus"
Repository = "https://github.com/karmendra8386/argus"
DOI = "https://doi.org/10.5281/zenodo.23427027"

[project.scripts]
argus = "gateway.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]
